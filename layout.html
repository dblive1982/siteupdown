<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Layout mock-up</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f1f5;font-family:system-ui,sans-serif;color:#111}
.h{background:#ffde59;padding:44px 16px 22px;text-align:center;position:relative}
.login{position:absolute;top:12px;right:12px;background:#e84a4a;color:#fff;font-weight:800;font-size:12px;padding:8px 14px;border-radius:99px;border:2.5px solid #111;box-shadow:0 3px 0 #111}
.h .mon{width:116px;display:block;margin:0 auto -4px}.h .logo{width:200px;display:block;margin:0 auto}
.w{max-width:340px;margin:26px auto 0;background:#fffbe8;border:3px solid #111;border-radius:30px;box-shadow:7px 7px 0 #111;overflow:hidden}
.bar{background:#fbc02d;border-bottom:3px solid #111;padding:10px 14px;display:flex;gap:8px;align-items:center;font-weight:900}
.bar i{flex:1;height:22px;background:#fffbe8;border:2.5px solid #111;border-radius:99px}
.b{padding:26px 22px 30px}.row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.row b{flex:0 0 52px;height:3px;background:#111}.row input{flex:1;height:36px;border:2.5px solid #111;border-radius:12px;background:#fff;min-width:0}
.go{display:block;margin:22px auto 0;width:110px;height:30px;background:#e84a4a;border:2.5px solid #111;border-radius:99px}
.art{position:relative;height:250px;max-width:412px;margin:20px auto 0}
.art img{position:absolute}.m1{left:12px;top:60px;width:82px;transform:rotate(-2deg)}.g{left:106px;top:124px;width:56px}
.help{position:absolute;left:100px;top:28px;background:#7ed957;border:2.5px solid #111;box-shadow:0 4px 0 #111;border-radius:99px;font-weight:900;color:#fff;padding:10px 24px;font-size:15px}
.m2{right:8px;top:36px;width:210px}
</style></head><body>
<div class="h"><span class="login">LOGIN</span><img class="mon" src="assets/nl-monster.png" alt=""><img class="logo" src="assets/nl-logo.png" alt="Site up down?"></div>
<div class="w"><div class="bar">‹<i></i>›</div><div class="b"><div class="row"><b></b><input></div><div class="row"><b></b><input></div><span class="go"></span></div></div>
<div class="art"><img class="m1" src="assets/nl-map.png" alt=""><span class="help">HELP</span><img class="g" src="assets/nl-globe.png" alt=""><img class="m2" src="assets/nl-map.png" alt=""></div>
</body></html>
