<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Heat map - countries mock-up</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f1f5;font-family:system-ui,sans-serif;color:#111}
.h{background:#ffde59;padding:18px 16px;text-align:center}.h img{width:170px}
main{padding:18px 8px 40px;max-width:1000px;margin:0 auto}h1{margin:6px 8px 4px;font-size:1.9rem}p.l{color:#444;margin:0 8px 8px}
.btns{display:flex;gap:8px;margin:10px 8px}.tab{border:2.5px solid #111;border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;background:#fffbe8}.tab.on{background:#7ed957;box-shadow:0 3px 0 #111}
#map{display:block;width:100%;height:auto;margin:6px 0;touch-action:manipulation}
.cn{font:700 11px "Chalkboard SE","Comic Sans MS",system-ui,sans-serif;fill:#3b2414;text-anchor:middle;letter-spacing:.06em;paint-order:stroke;stroke:rgba(255,248,225,.55);stroke-width:2.2px;pointer-events:none}
.oc{font:italic 700 17px Georgia,serif;fill:#2d6f93;text-anchor:middle;letter-spacing:.35em;opacity:.8;pointer-events:none}
.pole{cursor:pointer}.pole text{font:800 12px system-ui;fill:#111;paint-order:stroke;stroke:#fffbe8;stroke-width:3.5px;display:none}.pole.on text{display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:600;margin:10px 8px}.leg i{display:inline-block;width:16px;height:16px;border:2.5px solid #111;border-radius:50%;vertical-align:-3px;margin-right:5px}
.g{background:#7ed957}.a{background:#ffb020}.r{background:#e84a4a}
.pop{background:#fffbe8;border:3px solid #111;border-radius:18px;box-shadow:5px 5px 0 #111;padding:12px 14px;margin:14px 8px}.pop b{font-size:1.1rem}.chip{float:right;background:#ffb020;border:2.5px solid #111;border-radius:99px;padding:0 10px;font-weight:800}.pop small{display:block;color:#444;margin-top:4px}
</style></head><body><div class="h"><img src="assets/nl-logo.png" alt=""></div>
<main><h1>Global heat map.</h1><p class="l">Where in the world are websites reachable right now? Tap a pole.</p>
<div class="btns"><span class="tab on">Reachability</span><span class="tab">Response time</span></div>
<svg id="map" viewBox="0 0 960 830" role="img" aria-label="World map with a pole for each place we check from"><defs>
<filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#fff" stroke-width="1.6" opacity=".38"/></pattern></defs>
<image href="assets/nl-crayon-paper.png" x="0" y="0" width="960" height="830"/>
<g id="land" filter="url(#wob)" style="mix-blend-mode:multiply"></g><g id="hatchg" filter="url(#wob)" style="pointer-events:none"></g><g id="seas"></g><g id="names"></g><g id="poles"></g></svg>
<div class="leg"><span><i class="g"></i>90% or more reached</span><span><i class="a"></i>70 to 90%</span><span><i class="r"></i>Under 70%</span></div>
<div class="pop" id="pop"><span class="chip" id="pc">78%</span><b id="pn">Mumbai, India</b><small>Most sites answered from here, but some did not.</small><small id="pt">Typical time 420 ms</small></div></main>
<script src="assets/countries-map.js?v=8"></script></body></html>
